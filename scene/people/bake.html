<!doctype html>
<!-- Loaded by bake.mjs in a headless browser: one Rocketbox avatar plus its
     clips (and a hand-held prop, props.js) in, one glTF binary posted back to
     /out/<id>.glb. ?preview=<seconds> renders the first clip's pose at that
     moment instead. -->
<html>
  <body style="margin: 0">
    <script type="importmap">
      { "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
      import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
      import { attachProp } from "/props.js";

      const q = new URLSearchParams(location.search);
      const avatar = q.get("avatar");
      const group = q.get("group") || "Adults";
      const anims = q.get("anims").split(",");

      try {
        // the FBX files point at textures by Max paths that don't exist: skip them
        const manager = new THREE.LoadingManager();
        manager.setURLModifier((u) => (/\.(tga|png|jpe?g)$/i.test(u) ? "data:," : u));
        const fbx = new FBXLoader(manager);

        const person = await fbx.loadAsync(`/rb/Avatars/${group}/${avatar}/Export/${avatar}.fbx`);
        person.name = avatar;
        person.scale.setScalar(0.01); // centimetres -> metres

        const loader = new THREE.TextureLoader();
        const tex = (n, srgb) =>
          new Promise((done) =>
            loader.load(
              `/tex/${avatar}/${n}.png`,
              (t) => {
                if (srgb) t.colorSpace = THREE.SRGBColorSpace;
                done(t);
              },
              undefined,
              () => done(null),
            ),
          );

        // Rocketbox avatars have three materials: body, head, and "opacity"
        // (hair, lashes) whose alpha cuts the strands out
        const materials = {};
        for (const part of ["body", "head", "opacity"]) {
          const map = await tex(part === "opacity" ? "opacity_color" : `${part}_color`, true);
          if (!map) continue;
          const m = new THREE.MeshStandardMaterial({ name: `${avatar}_${part}`, map, metalness: 0 });
          if (part === "opacity") {
            m.alphaTest = 0.45;
            m.side = THREE.DoubleSide;
            m.roughness = 0.75;
          } else {
            m.normalMap = await tex(`${part}_normal`);
            m.roughnessMap = await tex(`${part}_rough`);
            m.roughness = 1;
          }
          materials[part] = m;
        }
        person.traverse((o) => {
          if (!o.isMesh) return;
          const ms = [].concat(o.material).map((m) => materials[m.name.split("_").pop()] ?? m);
          o.material = ms.length === 1 ? ms[0] : ms;
        });

        const clips = [];
        let walkSpeed = 0;
        for (const anim of anims) {
          // (walks only come with their travel kept, from the "xy" set)
          const walk = anim.includes("_walk_");
          const set = walk ? "xy" : "static";
          const clip = (await fbx.loadAsync(`/rb/Animations/all_animations_max_motextr_${set}/${anim}.max.fbx`)).animations[0];
          // rotations make the pose; only the hips move through space; scales never change
          clip.tracks = clip.tracks.filter((t) => t.name.endsWith(".quaternion") || t.name === "Bip01.position");
          clip.name = anim;
          if (walk) {
            // walked on the spot: the hips' steady travel forward (z, in cm) comes
            // out, its unevenness within the stride stays; the website moves the
            // figure along at the speed the clip walked, kept on the avatar
            const hips = clip.tracks.find((t) => t.name === "Bip01.position");
            const v = hips.values;
            const n = hips.times.length;
            const z0 = v[2];
            const travel = v[3 * n - 1] - z0;
            for (let i = 0; i < n; i++) v[3 * i + 2] -= z0 + (travel * hips.times[i]) / clip.duration;
            walkSpeed = +(travel / 100 / clip.duration).toFixed(3);
          }
          clips.push(clip);
        }
        const clip = clips[0];
        if (q.get("prop")) {
          const mixer = new THREE.AnimationMixer(person);
          const held = clips.find((c) => c.name === q.get("propClip")) ?? clip;
          mixer.clipAction(held).play();
          attachProp(q.get("prop"), person, mixer, held, +(q.get("propAt") || 0));
          mixer.stopAllAction();
          mixer.uncacheRoot(person);
        }

        if (q.has("preview")) {
          const mixer = new THREE.AnimationMixer(person);
          mixer.clipAction(clip).play();
          mixer.setTime(+q.get("preview") || 3);
          const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
          r.setSize(600, 900);
          r.toneMapping = THREE.AgXToneMapping;
          document.body.appendChild(r.domElement);
          const scene = new THREE.Scene();
          scene.background = new THREE.Color("#3a332c");
          scene.add(new THREE.HemisphereLight("#fff4e6", "#3a2e24", 2.5), person);
          const cam = new THREE.PerspectiveCamera(30, 600 / 900, 0.1, 50);
          cam.position.set(0, 1.0, 4.6);
          cam.lookAt(0, 0.9, 0);
          r.render(scene, cam);
          window.done = r.domElement.toDataURL("image/png");
        } else {
          // (FBXLoader's notes on every bone would go out as glTF extras: only the walk speed does)
          person.traverse((o) => (o.userData = {}));
          if (walkSpeed) person.userData.walkSpeed = walkSpeed;
          const glb = await new GLTFExporter().parseAsync(person, { binary: true, animations: clips });
          await fetch(`/out/${q.get("id")}.glb`, { method: "POST", body: glb });
          window.done = "glb";
        }
      } catch (e) {
        window.failed = `${e.message}\n${e.stack}`;
      }
    </script>
  </body>
</html>
